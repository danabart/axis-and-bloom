name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: axis-and-bloom-prod
  REGION: us-central1
  SERVICE: axis-bloom-backend
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # C14 — keyless CI via Workload Identity Federation. Replaces the
      # long-lived exported GCP_SA_KEY (H6) with short-lived tokens minted
      # from this job's own GitHub OIDC identity. The provider itself is
      # locked to this exact repo (attribute-condition
      # `assertion.repository == 'danabart/axis-and-bloom'`, set at pool-
      # provider creation time) and the SA grant below is additionally
      # scoped to a principalSet for that same repository attribute —
      # belt-and-suspenders, no other repo can impersonate this SA either
      # way. GCP_SA_KEY is deliberately NOT removed from GitHub secrets or
      # deleted in GCP yet — kept as a fallback until this deploy is proven
      # (see WHAT_WE_BUILT_SECURITY.md / RUN_ORDER.md C14).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/892123729036/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deploy@axis-and-bloom-prod.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      # C11 — npm-audit CI gate. Gates on high/critical in the PRODUCTION
      # dependency tree only (--omit=dev): dev-only tooling (vitest's own
      # vite/esbuild/postcss/nanoid chain) never reaches the deployed
      # container, so auditing it here would fail the build on noise no
      # code change here can fix. Runs before the Docker build/push/deploy
      # steps below, so a real high/critical hit blocks the whole job
      # before anything touches production.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependency audit
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/axis-bloom/${{ env.SERVICE }}:${{ github.sha }} ./backend
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/axis-bloom/${{ env.SERVICE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/axis-bloom/${{ env.SERVICE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.PROJECT_ID }}:${{ env.REGION }}:axis-bloom-db \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,SHOPIFY_STORE_DOMAIN=SHOPIFY_STORE_DOMAIN:latest,SHOPIFY_STOREFRONT_TOKEN=SHOPIFY_STOREFRONT_TOKEN:latest,SHOPIFY_ADMIN_TOKEN=SHOPIFY_ADMIN_TOKEN:latest,RESEND_API_KEY=RESEND_API_KEY:latest,MAILCHIMP_API_KEY=MAILCHIMP_API_KEY:latest,MAILCHIMP_LIST_ID=MAILCHIMP_LIST_ID:latest,CRON_SECRET=CRON_SECRET:latest,SMS_PROVIDER_ACCOUNT_SID=SMS_PROVIDER_ACCOUNT_SID:latest,SMS_PROVIDER_AUTH_TOKEN=SMS_PROVIDER_AUTH_TOKEN:latest,SMS_FROM_NUMBER=SMS_FROM_NUMBER:latest" \
            --set-env-vars "FRONTEND_URL=https://www.axisandbloomcoffee.com,BACKEND_URL=https://axis-bloom-backend-oiub7eumya-uc.a.run.app,GLOBAL_RATE_LIMIT_MAX=2000,CLAUDE_GLOBAL_DAILY_USD=50,CLAUDE_ENABLED=true,APP_CHECK_ENFORCED=true" \
            --quiet

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # C14 — same WIF identity as the backend job (deploy-frontend never
      # opens/comments on PRs — this workflow only triggers on push to
      # main — so the L7 `pull-requests: write` scope above was dead
      # weight, trimmed).
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/892123729036/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deploy@axis-and-bloom-prod.iam.gserviceaccount.com'

      - name: Get backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe axis-bloom-backend \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # C11 — npm-audit CI gate, same --omit=dev/--audit-level=high
      # rationale as the backend job. A separate step (not folded into the
      # build step below) so a failure here reads clearly as "dependency
      # audit failed," not "build failed."
      - name: Install & audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.backend.outputs.url }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: axis-and-bloom-prod.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: axis-and-bloom-prod
          VITE_FIREBASE_STORAGE_BUCKET: axis-and-bloom-prod.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "892123729036"
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # C6 — reCAPTCHA v3 site key for Firebase App Check. Public by
          # design (ships in the bundle, same as the Firebase web config
          # above) -- safe to hardcode here rather than a repo secret.
          VITE_RECAPTCHA_APPCHECK_SITE_KEY: '6LcoeHwtAAAAANcHTyuClbWwFi6Q3jmEv7szavxv'
          VITE_PRELAUNCH_MODE: 'true'
          VITE_GA4_ID: 'G-GYC50VYRYN'
          VITE_META_PIXEL_ID: '945138695260153'
        run: npm run build

      # C14 — FirebaseExtended/action-hosting-deploy@v0 only accepts a
      # `firebaseServiceAccount` key-file input, no WIF/ADC option, so it
      # can't keep working keyless. Deploys instead via the Firebase CLI
      # directly, run in this same job after the `auth` step above:
      # google-github-actions/auth@v2 sets GOOGLE_APPLICATION_CREDENTIALS
      # to a short-lived WIF-derived credential file for the rest of the
      # job, and firebase-tools reads that as Application Default
      # Credentials automatically — no separate `firebase login` needed.
      # Repo root (default working directory) so `firebase.json` resolves
      # the same way the old action did; `deploy --only hosting` targets
      # the live channel by default, matching the old `channelId: live`.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project axis-and-bloom-prod --non-interactive
