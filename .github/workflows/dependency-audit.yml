name: Dependency audit

# Follow-up to C11. Runs the same gate the deploy uses
# (`npm audit --omit=dev --audit-level=high`) once a day, so a new advisory
# surfaces as a GitHub issue the day it lands instead of as a failed deploy.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_LABEL: dependency-audit
  ISSUE_TITLE: 'Dependency audit: new high/critical advisory'

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both audits always run (continue-on-error); the last step fails the
      # job if either one failed.
      - name: Backend audit
        id: backend
        continue-on-error: true
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high 2>&1 | tee "$RUNNER_TEMP/backend-audit.txt"
          exit "${PIPESTATUS[0]}"

      - name: Frontend audit
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high 2>&1 | tee "$RUNNER_TEMP/frontend-audit.txt"
          exit "${PIPESTATUS[0]}"

      - name: Open or update issue on failure
        if: steps.backend.outcome == 'failure' || steps.frontend.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue-body.md"
          {
            echo "The daily dependency audit found a high/critical advisory in the production dependency tree."
            echo
            echo "Run: $RUN_URL"
            if [ "$BACKEND_OUTCOME" = "failure" ]; then
              echo
              echo "### Failed: backend"
              echo '```'
              cat "$RUNNER_TEMP/backend-audit.txt"
              echo '```'
            fi
            if [ "$FRONTEND_OUTCOME" = "failure" ]; then
              echo
              echo "### Failed: frontend"
              echo '```'
              cat "$RUNNER_TEMP/frontend-audit.txt"
              echo '```'
            fi
            echo
            cat <<'FIX'
          Fix, in order:
          1. If a Dependabot security PR is open for this package, merge it.
          2. Otherwise run `npm audit fix` (never `--force`) in that folder and commit the lockfile.
          3. If the audit still fails, a parent package is pinning the vulnerable version. Add an `overrides` entry in that folder's `package.json`, the same way `undici` and `@grpc/grpc-js` are handled in `frontend/package.json`.
          4. If no patched version exists yet and a deploy cannot wait, use the manual Deploy run with "skip dependency audit" (see WHAT_WE_BUILT_SECURITY.md). Leave this issue open until the audit is clean.
          FIX
          } > "$body"

          gh label create "$ISSUE_LABEL" --color D93F0B \
            --description "Daily npm audit found a high/critical advisory" 2>/dev/null || true

          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$body"
          fi

      - name: Close issue when clean
        if: steps.backend.outcome == 'success' && steps.frontend.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Audit clean"
            gh issue close "$existing"
          fi

      - name: Fail the job if either audit failed
        if: steps.backend.outcome == 'failure' || steps.frontend.outcome == 'failure'
        run: |
          echo "backend: ${{ steps.backend.outcome }}, frontend: ${{ steps.frontend.outcome }}"
          exit 1
