# Dependency freshness (follow-up to C11, 2026-10-04). See
# WHAT_WE_BUILT_SECURITY.md "Dependency freshness".
#
# What this does: weekly grouped PRs for minor/patch updates of DIRECT
# dependencies (backend, frontend), monthly PRs for GitHub Actions versions.
# What it does NOT do: refresh transitive packages by itself (the four deploy
# failures of Sep 30 - Oct 4 were all transitive), or manage `overrides`.
# Same-day fixes for transitive advisories come from Dependabot SECURITY
# updates, enabled in GitHub repo settings (not configurable from this file).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Majors are deliberately NOT ignored here: the runner logs warn that
  # actions/checkout@v4, actions/setup-node@v4, google-github-actions/auth@v2
  # and google-github-actions/setup-gcloud@v2 target deprecated Node 20, and
  # the fixes are major versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
